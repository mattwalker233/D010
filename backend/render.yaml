services:
  - type: web
    name: division-orderly-backend
    env: python
    buildCommand: |
      apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils
      pip install -r requirements.txt
    startCommand: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: PYTHON_VERSION
        value: 3.11.0 